---
- name: Basic server configuration
  hosts: all
  become: yes
  roles:
    - base

- name: Installation and configuration of DoH
  hosts:
    - ge
    - sw
  become: yes
  roles:
    - doh

- name: Web sites configuration
  hosts: sw
  become: yes
  roles:
    - sites

- name: Changing DNS servers
  hosts: 'all:!sw:!ge'
  become: yes
  roles:
    - dns
