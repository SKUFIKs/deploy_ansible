---
- name: Require sites_configs from secrets
  ansible.builtin.assert:
    that:
      - sites_configs | length > 0
    fail_msg: >-
      sites_configs is empty. Provide domains, template names and backends
      via Ansible extra vars (see docs/extra_vars.example.yml).

- name: Ensure ACME webroot exists
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy site configurations
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: /etc/nginx/sites-available/{{ item.domain }}.conf
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites_configs }}"
  loop_control:
    label: "{{ item.template }}"
  notify: restart nginx

- name: Enable site configurations
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item.domain }}.conf
    dest: /etc/nginx/sites-enabled/{{ item.domain }}.conf
    state: link
  loop: "{{ sites_configs }}"
  loop_control:
    label: "{{ item.template }}"
  notify: restart nginx

- name: Disable legacy site symlink
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/pterodactyl.conf
    state: absent
  notify: restart nginx

- name: Allow direct site ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ sites_configs | selectattr('direct_ports', 'defined') | map(attribute='direct_ports') | flatten | unique }}"

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
