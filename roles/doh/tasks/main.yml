---
- name: Require DoH settings from secrets
  ansible.builtin.assert:
    that:
      - doh_domain is defined and doh_domain | length > 0
      - doh_zone is defined and doh_zone | length > 0
      - doh_secret_path is defined and doh_secret_path | length > 0
      - doh_email is defined and doh_email | length > 0
    fail_msg: >-
      doh_domain, doh_zone, doh_secret_path and doh_email must be provided
      via Ansible extra vars (see docs/extra_vars.example.yml).

- name: Install Nginx, dnsmasq and build dependencies for DoH
  ansible.builtin.apt:
    name:
      - nginx
      - libnginx-mod-stream
      - dnsmasq
      - git
      - golang-go
      - make
    state: present
    update_cache: yes

- name: Clone m13253/dns-over-https repository
  ansible.builtin.git:
    repo: 'https://github.com/m13253/dns-over-https.git'
    dest: /tmp/dns-over-https
    version: v2.3.10
    force: yes
  when: not ansible_check_mode

- name: Build and install doh-server from source
  ansible.builtin.command:
    cmd: make install
    chdir: /tmp/dns-over-https
    creates: /usr/local/bin/doh-server
  notify:
    - reload systemd
    - restart doh-server

- name: Clean up temporary source directory
  ansible.builtin.file:
    path: /tmp/dns-over-https
    state: absent

- name: Install Certbot and Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
    update_cache: yes

- name: Ensure .secrets directory exists
  ansible.builtin.file:
    path: /root/.secrets
    state: directory
    mode: '0700'

- name: Create Cloudflare credentials file
  ansible.builtin.copy:
    dest: /root/.secrets/cloudflare.ini
    content: |
      dns_cloudflare_api_token = {{ cloudflare_token }}
    mode: '0600'
    owner: root
    group: root
  check_mode: no
  no_log: true

- name: Issue SSL certificate via DNS-01 (Only if missing)
  ansible.builtin.command:
    cmd: >
      certbot certonly --dns-cloudflare
      --dns-cloudflare-credentials /root/.secrets/cloudflare.ini
      -d {{ doh_domain }}
      --email {{ doh_email }}
      --agree-tos --non-interactive
      --dns-cloudflare-propagation-seconds 20
  args:
    creates: /etc/letsencrypt/live/{{ doh_domain }}/fullchain.pem

- name: Copy Dnsmasq config
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
  notify: restart dnsmasq

- name: Ensure dnsmasq.d directory exists
  ansible.builtin.file:
    path: /etc/dnsmasq.d
    state: directory

- name: Copy secret domain spoof list
  ansible.builtin.copy:
    src: spoof.conf
    dest: /etc/dnsmasq.d/spoof.conf
  notify: restart dnsmasq

- name: Validate dnsmasq configuration
  ansible.builtin.command:
    cmd: dnsmasq --test
  changed_when: false

- name: Ensure DoH-server config directory exists
  ansible.builtin.file:
    path: /etc/dns-over-https
    state: directory
    mode: '0755'

- name: Copy DoH-server config
  ansible.builtin.template:
    src: doh-server.conf.j2
    dest: /etc/dns-over-https/doh-server.conf
  notify: restart doh-server

- name: Check for legacy doh-bridge service
  ansible.builtin.stat:
    path: /etc/systemd/system/doh-bridge.service
  register: doh_legacy_bridge

- name: Stop and disable legacy doh-bridge service
  ansible.builtin.systemd:
    name: doh-bridge
    state: stopped
    enabled: no
  when: doh_legacy_bridge.stat.exists

- name: Enable and start doh-server
  ansible.builtin.systemd:
    name: doh-server
    enabled: yes
    state: started

- name: Copy main Nginx config (stream/L4 + http)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: restart nginx

- name: Copy Nginx virtual host
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/{{ doh_domain }}
  notify: restart nginx

- name: Enable Nginx site (symlink)
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ doh_domain }}
    dest: /etc/nginx/sites-enabled/{{ doh_domain }}
    state: link
  notify: restart nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Allow HTTP and HTTPS in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '80'
    - '443'

- name: Allow DNS (TCP and UDP) in UFW
  community.general.ufw:
    rule: allow
    port: '53'
    proto: "{{ item }}"
  loop:
    - tcp
    - udp
