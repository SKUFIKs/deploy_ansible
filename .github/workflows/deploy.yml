name: Run Ansible Playbook

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: "Lint & syntax check"
    runs-on: [self-hosted, terraform-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up lint tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-lint-venv"
          "$RUNNER_TEMP/ansible-lint-venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/ansible-lint-venv/bin/pip" install --quiet ansible-lint
          echo "$RUNNER_TEMP/ansible-lint-venv/bin" >> "$GITHUB_PATH"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Ansible syntax check
        run: ansible-playbook -i 'localhost,' --syntax-check playbook.yml

  deploy:
    name: "Ansible"
    needs: lint
    runs-on: [self-hosted, terraform-runner]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare Inventory and SSH Config
        run: |
          echo "${{ secrets.ANSIBLE_INVENTORY }}" > inventory.ini
          mkdir -p ~/.ssh
          echo "Host *" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  ConnectionAttempts 3" >> ~/.ssh/config

      - name: Prepare Dnsmasq Spoof List
        run: |
          mkdir -p roles/doh/files
          echo "${{ secrets.DNSMASQ_SPOOF_LIST }}" > roles/doh/files/spoof.conf

      - name: Prepare Ansible extra vars
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          EXTRA_VARS: ${{ secrets.ANSIBLE_EXTRA_VARS }}
        run: |
          umask 077
          {
            printf '%s\n' "$EXTRA_VARS"
            printf 'cloudflare_token: "%s"\n' "$CF_TOKEN"
          } > extra_vars.yml
          chmod 600 extra_vars.yml

      - name: Mask sensitive values in logs
        run: |
          grep -E '^[[:space:]]*(-[[:space:]]+)?(doh_domain|doh_zone|doh_email|doh_secret_path|domain|backend):' extra_vars.yml \
            | sed -E 's/^[^:]*:[[:space:]]*//; s/^"(.*)"$/\1/; s/[[:space:]]+$//' \
            | while IFS= read -r value; do
                if [ -n "$value" ]; then
                  printf '::add-mask::%s\n' "$value"
                fi
              done

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini playbook.yml --extra-vars @extra_vars.yml

      - name: Remove Ansible extra vars
        if: always()
        run: rm -f extra_vars.yml
